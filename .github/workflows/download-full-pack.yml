name: Download full-pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-full-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download full-pack.7z
        shell: bash
        run: |
          set -euo pipefail

          download_dir="${RUNNER_TEMP}/full-pack-download"
          output_file="${download_dir}/full-pack.7z"

          mkdir -p "${download_dir}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "https://download.ra2web.com/full-pack.7z" \
            --output "${output_file}"

          test -s "${output_file}"

      - name: Upload full-pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-pack
          path: ${{ runner.temp }}/full-pack-download/full-pack.7z
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
